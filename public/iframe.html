<!DOCTYPE html>
<html lang="<%= htmlWebpackPlugin.options.proca.lang %>">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link
      rel="alternate"
      type="application/json+oembed"
      href="/d/<%= htmlWebpackPlugin.options.title %>/oembed.json"
      title="Embed JSON"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      }
    </style>
    <script>
      window.addEventListener("proca", function (e) {
        try {
          var payload = JSON.parse(JSON.stringify(e.detail));
          window.parent && window.parent.postMessage(payload, "*");
        } catch (err) {
          console.error("can't forward proca event", err);
        }
      });
      window.addEventListener("message", function (e) {
        if (e.source !== window.parent) return;
        var allowed = window.procaAllowedOrigins || [];
        if (allowed.length && !allowed.includes(e.origin)) return;
        var data = e.data || {};
        if (!data.proca || !window.proca) return;
        var proca = window.proca;
        switch (data.action) {
          case "setFilter":
            proca.setFilter(data.id, data.filter || { rule: data.rule });
            break;
          case "removeFilter":
            proca.removeFilter(data.id);
            break;
          case "select":
            proca.select(data.procaids || []);
            break;
          case "selectAll":
            proca.selectAll();
            break;
        }
      });
    </script>
  </head>
  <body>
    <div class="proca-widget"></div>
  </body>
</html>
